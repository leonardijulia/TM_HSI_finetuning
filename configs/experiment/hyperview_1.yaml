# @package _global_

defaults:
  - override /model: regression_task
  - override /data: hyperview_1
  - override /scheduler: reduce_on_plateau
  - override /trainer: gpu

trainer:
  max_epochs: 1

model:
  model_args:
    backbone_in_chans: 13
    # backbone_bands:
    #   S2L2A: ["BLUE", "GREEN", "RED", "RED_EDGE_1", "RED_EDGE_2", "RED_EDGE_3",
    #             "NIR_BROAD", "NIR_NARROW", "WATER_VAPOR", "MASK"] 
    head_num_outputs: 4
    head_dropout: 0.2
    head_dim_list: [256]
    head_linear_after_pool: true
  num_outputs: 4
  path_to_record_metrics: ${outputs_root}/hyperview_1/ 
  #var_names: ["P", "K", "Mg", "pH"]

optimizer:
  lr: 5.4e-5
  weight_decay: 0.01