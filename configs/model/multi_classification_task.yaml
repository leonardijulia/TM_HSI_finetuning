_target_: terratorch.tasks.MultiLabelClassificationTask
model_factory: EncoderDecoderFactory
model_args:
  backbone: terramind_v1_base
  backbone_ckpt_path: ${backbone_ckpt_path}
  backbone_pretrained: false
  backbone_img_size: 128

  necks:
    - name: SelectIndices
      indices: [-1]
    - name: PermuteDims
      new_order: [0, 2, 1]
  decoder: LinearDecoder
  decoder_channels: 256 # check again SE implementation
  decoder_num_classes: 19 # check again that it actually performs multiclass

freeze_backbone: false
freeze_decoder: false
loss: bce